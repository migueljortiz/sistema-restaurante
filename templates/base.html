<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Restaurante{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --color-principal: #B5451B;
            --color-oscuro: #2B2D42;
            --color-acento: #F4A259;
            --color-fondo: #FAF3E8;
        }
        body { background-color: var(--color-fondo); }
        .navbar { background-color: var(--color-oscuro); }
        .navbar-brand { color: var(--color-acento) !important; font-weight: bold; }
        .btn-principal { background-color: var(--color-principal); color: #fff; border: none; }
        .btn-principal:hover { background-color: #8f3615; color: #fff; }
        .aside a { color: var(--color-oscuro); text-decoration: none; display: block; padding: .5rem 1rem; border-radius: .4rem; }
        .aside a:hover { background-color: var(--color-acento); }
        .card-header { background-color: var(--color-principal); color: #fff; }
        footer { background-color: var(--color-oscuro); color: #fff; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'pedidos:lista' %}">🍽️ Restaurante</a>
            <a class="btn btn-sm btn-outline-light" href="{% url 'admin:index' %}">Administración</a>
        </div>
    </nav>

    <div class="container-fluid flex-grow-1">
        <div class="row">
            <aside class="col-md-2 py-4 aside">
                <a href="{% url 'pedidos:lista' %}">📋 Pedidos</a>
            </aside>
                        <main class="col-md-10 py-4">
                {% if messages %}
                    {% for m in messages %}
                    <div class="alert alert-success">{{ m }}</div>
                    {% endfor %}
                {% endif %}
                {% block contenido %}{% endblock %}
            </main>
        </div>
    </div>

    <footer class="text-center py-3">
        Sistema de Pedidos de Restaurante · Uniguajira
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
